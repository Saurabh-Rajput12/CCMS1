<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>College Complaint Management System</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Poppins', sans-serif;
      background: url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1500&q=80') no-repeat center center/cover;
      color: #fff;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.6);
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
      animation: fadeIn 1.5s ease-in-out;
    }

    h1 {
      font-size: 3rem;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 i {
      margin-right: 10px;
      color: #00c9ff;
    }

    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .register-btn {
      background-color: #00c9ff;
      border: none;
      padding: 15px 35px;
      font-size: 1.1rem;
      color: #fff;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .register-btn i {
      font-size: 1.2rem;
    }

    .register-btn:hover {
      background-color: #0088cc;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.2rem;
      }

      p {
        font-size: 1rem;
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>
<div class="overlay"></div>
<div class="container">
    <h1><i class="fas fa-bullhorn"></i> Welcome to CCMS</h1>
    <p>Your voice matters. Easily report and track issues directly to the college administration. Join us in improving our campus environment.</p>
    <button class="register-btn" onclick="redirectToRegister()">
      <i class="fas fa-user-plus"></i> Register
    </button>
</div>
<script>
  function redirectToRegister() {
    window.location.href = "register.php";
  }
</script>
</body>
</html>
